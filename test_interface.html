<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票簡訊系統 - 測試介面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .test-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .test-section {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .quick-commands {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .quick-commands h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 16px;
        }

        .command-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .command-btn {
            padding: 10px 15px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .command-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .send-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .response-area {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            min-height: 200px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .response-area.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .example-section {
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
            margin-bottom: 20px;
        }

        .example-section h4 {
            margin-bottom: 10px;
            color: #856404;
        }

        .example-section ul {
            list-style: none;
            padding-left: 0;
        }

        .example-section li {
            padding: 5px 0;
            color: #856404;
            font-size: 14px;
        }

        .example-section li:before {
            content: "▸ ";
            color: #ffc107;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 股票簡訊查詢系統</h1>
            <p>專題展示測試介面 - Demo Testing Interface</p>
        </div>

        <div class="content">
            <div class="test-section">
                <div>
                    <div class="input-group">
                        <label>手機號碼 (Phone Number)</label>
                        <input type="text" id="phone" value="0982018407" placeholder="例如: 0912345678">
                    </div>

                    <div class="input-group">
                        <label>簡訊內容 (Message)</label>
                        <input type="text" id="message" placeholder="例如: 2330" autofocus>
                    </div>

                    <button class="send-btn" onclick="sendMessage()">🚀 發送測試訊息</button>
                </div>

                <div class="quick-commands">
                    <h3>快速指令 Quick Commands</h3>
                    <div class="command-buttons">
                        <button class="command-btn" onclick="setMessage('2330')">2330</button>
                        <button class="command-btn" onclick="setMessage('0050')">0050</button>
                        <button class="command-btn" onclick="setMessage('2317')">2317</button>
                        <button class="command-btn" onclick="setMessage('訂閱 2330')">訂閱</button>
                        <button class="command-btn" onclick="setMessage('取消 2330')">退訂</button>
                        <button class="command-btn" onclick="setMessage('我訂')">我訂</button>
                        <button class="command-btn" onclick="setMessage('說明')">說明</button>
                        <button class="command-btn" onclick="setMessage('護國神山')">護國神山</button>
                    </div>
                </div>
            </div>

            <div class="example-section">
                <h4>💡 可測試的指令範例</h4>
                <ul>
                    <li>查價: 2330、0050、TSLA</li>
                    <li>訂閱: 訂閱 2330、訂閱 0050 09:00</li>
                    <li>退訂: 取消 2330、退訂 0050</li>
                    <li>列表: 我訂、我警</li>
                    <li>自然語言: 護國神山、GG、海爸</li>
                </ul>
            </div>

            <h3 style="margin-bottom: 15px; color: #333;">📬 系統回覆 System Response</h3>
            <div class="response-area" id="response">等待測試...</div>
        </div>
    </div>

    <script>
        function setMessage(text) {
            document.getElementById('message').value = text;
            document.getElementById('message').focus();
        }

        async function sendMessage() {
            const phone = document.getElementById('phone').value;
            const message = document.getElementById('message').value;
            const responseArea = document.getElementById('response');
            const sendBtn = document.querySelector('.send-btn');

            if (!phone || !message) {
                alert('請輸入手機號碼和訊息內容');
                return;
            }

            // 顯示載入中
            responseArea.classList.add('loading');
            responseArea.innerHTML = '<div class="spinner"></div><p style="margin-top: 15px;">處理中...</p>';
            sendBtn.disabled = true;

            try {
                const response = await fetch('https://stock-sms-elder.onrender.com/api/test', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        phone: phone,
                        message: message
                    })
                });

                const data = await response.json();
                
                responseArea.classList.remove('loading');
                
                if (data.success) {
                    responseArea.textContent = data.reply;
                } else {
                    responseArea.textContent = '❌ 錯誤: ' + (data.error || '未知錯誤');
                }
            } catch (error) {
                responseArea.classList.remove('loading');
                responseArea.textContent = '❌ 連線錯誤: ' + error.message;
            } finally {
                sendBtn.disabled = false;
            }
        }

        // 按 Enter 發送
        document.getElementById('message').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
